<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mis Finanzas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="authScreen" class="hidden fullscreen-center">
    <div class="auth-container">
      <h1 class="app-logo">💰 Mis Finanzas</h1>
      <p class="texto-secundario">Controla tus ingresos y gastos</p>
      <input type="email" id="email" placeholder="Correo electrónico" class="input-field">
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Contraseña" class="input-field">
        <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
      </div>
      <div class="auth-buttons">
        <button id="btnLogin" class="btn btn-primario">Iniciar sesión</button>
        <button id="btnRegister" class="btn btn-outline">Registrarse</button>
      </div>
      <button id="btnResetPassword" class="text-link">¿Olvidaste tu contraseña?</button>
      <p id="authError" class="error-text hidden"></p>
      <p id="authSuccess" class="success-text hidden"></p>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" class="hidden app-shell">
    <header class="app-header">
      <h1 id="tituloSeccion" class="titulo-seccion">Inicio</h1>
      <div class="header-actions">
        <input type="month" id="filtroMesHeader" class="input-mes">
      </div>
    </header>

    <main class="vistas-container">
      <!-- Vista Inicio -->
      <div id="vistaInicio" class="vista activa">
        <div class="resumen-grid">
          <div class="resumen-card ingreso-card"><span>Ingresos</span><strong id="totalIngresos">$0</strong></div>
          <div class="resumen-card gasto-card"><span>Gastos</span><strong id="totalGastos">$0</strong></div>
        </div>
        <div class="balance-card"><span>Balance del mes</span><strong id="balance"></strong></div>
        <div class="tendencia-container tarjeta p-4 mb-4">
          <h3 class="text-sm font-semibold mb-2">📊 Tendencia últimos meses</h3>
          <canvas id="graficaTendencia" class="max-h-32"></canvas>
        </div>
        <div class="movimientos-container">
          <h2>Movimientos</h2>
          <div id="listaTransacciones"></div>
        </div>
        <button id="fabAgregar" class="fab">+</button>
      </div>

      <!-- Vista Presupuesto -->
      <div id="vistaPresupuesto" class="vista">
        <div id="contenidoPresupuesto" class="presupuesto-container"></div>
      </div>

      <!-- Vista Categorías (REDISEÑADA) -->
      <div id="vistaCategorias" class="vista">
        <div class="categorias-container">
          <h2>Mis categorías</h2>
          <!-- Formulario para agregar nueva -->
          <form id="formCategoria" class="form-categoria">
            <div class="form-row">
              <input type="text" id="nombreCategoria" placeholder="Nombre de la categoría" required class="input-field flex-1">
              <div class="color-picker-wrapper">
                <input type="color" id="colorCategoria" value="#10b981" class="input-color">
              </div>
            </div>
            <div class="form-row">
              <select id="tipoCategoria" class="input-field flex-1">
                <option value="gasto">Gasto</option>
                <option value="ingreso">Ingreso</option>
              </select>
              <div class="emoji-selector">
                <input type="text" id="emojiCategoria" placeholder="🍕" maxlength="2" readonly class="input-field emoji-input">
                <div class="emoji-grid">
                  <span onclick="document.getElementById('emojiCategoria').value='🍔'">🍔</span>
                  <span onclick="document.getElementById('emojiCategoria').value='🚌'">🚌</span>
                  <span onclick="document.getElementById('emojiCategoria').value='🎮'">🎮</span>
                  <span onclick="document.getElementById('emojiCategoria').value='💡'">💡</span>
                  <span onclick="document.getElementById('emojiCategoria').value='📦'">📦</span>
                  <span onclick="document.getElementById('emojiCategoria').value='🏠'">🏠</span>
                  <span onclick="document.getElementById('emojiCategoria').value='❤️'">❤️</span>
                  <span onclick="document.getElementById('emojiCategoria').value='🎁'">🎁</span>
                  <span onclick="document.getElementById('emojiCategoria').value='💼'">💼</span>
                  <span onclick="document.getElementById('emojiCategoria').value='💻'">💻</span>
                  <span onclick="document.getElementById('emojiCategoria').value='🐶'">🐶</span>
                  <span onclick="document.getElementById('emojiCategoria').value='📚'">📚</span>
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-primario w-full">Agregar categoría</button>
          </form>
          <!-- Lista de categorías -->
          <div id="listaCategorias" class="lista-categorias mt-4"></div>
        </div>
      </div>

      <!-- Vista Ajustes -->
      <div id="vistaAjustes" class="vista">
        <div class="ajustes-panel">
          <h2>Ajustes</h2>
          <div class="ajuste-item">
            <span>Modo oscuro</span>
            <button id="toggleTemaAjustes" class="btn-icon">🌙</button>
          </div>
          <div class="ajuste-item">
            <span>Cambiar contraseña</span>
            <button id="btnCambiarPasswordAjustes" class="btn btn-outline-small">Cambiar</button>
          </div>
          <div id="panelCambioPassword" class="hidden mt-2">
            <input type="password" id="currentPassword" placeholder="Contraseña actual" class="input-field">
            <input type="password" id="newPassword" placeholder="Nueva contraseña" class="input-field">
            <button id="btnUpdatePassword" class="btn btn-primario w-full mt-2">Actualizar</button>
            <p id="passwordError" class="error-text hidden"></p>
            <p id="passwordSuccess" class="success-text hidden"></p>
          </div>
          <div class="ajuste-item">
            <span>Exportar movimientos (CSV)</span>
            <button id="btnExportarCSV" class="btn btn-outline-small">Exportar</button>
          </div>
          <button id="btnLogout" class="btn btn-peligro w-full mt-4">Cerrar sesión</button>
        </div>
      </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-vista="vistaInicio">🏠<span>Inicio</span></button>
      <button class="nav-item" data-vista="vistaPresupuesto">💵<span>Presupuesto</span></button>
      <button class="nav-item" data-vista="vistaCategorias">🏷️<span>Categorías</span></button>
      <button class="nav-item" data-vista="vistaAjustes">⚙️<span>Ajustes</span></button>
    </nav>

    <!-- Modal AGREGAR transacción -->
    <div id="modalTransaccion" class="modal hidden">
      <div class="modal-content">
        <h2>Nueva transacción</h2>
        <div class="tab-group">
          <button id="tabIngreso" class="tab active">Ingreso</button>
          <button id="tabGasto" class="tab">Gasto</button>
        </div>
        <input type="date" id="fecha" class="input-field">
        <select id="categoria" class="input-field"></select>
        <input type="text" id="descripcion" placeholder="Descripción" class="input-field">
        <input type="number" id="monto" placeholder="Monto" class="input-field">
        <div class="modal-buttons">
          <button id="btnCancelarModal" class="btn btn-outline">Cancelar</button>
          <button id="btnGuardarModal" class="btn btn-primario">Guardar</button>
        </div>
      </div>
    </div>

    <!-- Modal EDITAR transacción -->
    <div id="modalEditarTransaccion" class="modal hidden">
      <div class="modal-content">
        <h2>Editar transacción</h2>
        <input type="date" id="fechaEditar" class="input-field">
        <select id="categoriaEditar" class="input-field"></select>
        <input type="text" id="descripcionEditar" placeholder="Descripción" class="input-field">
        <input type="number" id="montoEditar" placeholder="Monto" class="input-field">
        <input type="hidden" id="idTransaccionEditar">
        <div class="modal-buttons">
          <button id="btnCancelarEditar" class="btn btn-outline">Cancelar</button>
          <button id="btnGuardarEditar" class="btn btn-primario">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui-main.js"></script>
  <script src="js/ui-presupuesto.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
