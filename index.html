<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 p-4 min-h-screen">

  <main class="max-w-md mx-auto space-y-6">
    
    <!-- Título -->
    <h1 class="text-3xl font-bold text-center text-emerald-600">💰 Mis Finanzas</h1>

    <!-- Resumen -->
    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white p-3 rounded shadow">
        <p class="text-xs text-gray-500">Ingresos</p>
        <p id="totalIngresos" class="text-lg font-bold text-emerald-500">$0</p>
      </div>
      <div class="bg-white p-3 rounded shadow">
        <p class="text-xs text-gray-500">Gastos</p>
        <p id="totalGastos" class="text-lg font-bold text-red-500">$0</p>
      </div>
      <div class="bg-white p-3 rounded shadow">
        <p class="text-xs text-gray-500">Balance</p>
        <p id="balance" class="text-lg font-bold">$0</p>
      </div>
    </section>

    <!-- Formulario -->
    <form id="formTransaccion" class="bg-white p-4 rounded shadow space-y-3">
      <select id="tipo" required class="w-full p-2 border rounded">
        <option value="ingreso">Ingreso</option>
        <option value="gasto" selected>Gasto</option>
      </select>
      <input type="text" id="descripcion" placeholder="¿En qué gastaste?" required class="w-full p-2 border rounded">
      <input type="number" id="monto" placeholder="Monto" step="0.01" required class="w-full p-2 border rounded">
      <button type="submit" class="w-full bg-emerald-500 text-white py-2 rounded font-semibold hover:bg-emerald-600">
        Agregar
      </button>
    </form>

    <!-- Lista de movimientos -->
    <section class="bg-white p-4 rounded shadow">
      <h2 class="font-semibold mb-3">Movimientos</h2>
      <div id="listaTransacciones" class="space-y-2">
        <p class="text-gray-400 text-center">No hay movimientos aún</p>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
