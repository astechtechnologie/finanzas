<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 p-4 min-h-screen">

  <main class="max-w-md mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-center text-emerald-600">💰 Mis Finanzas</h1>

    <section class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white p-3 rounded shadow">
        <p class="text-xs text-gray-500">Ingresos</p>
        <p id="totalIngresos" class="text-lg font-bold text-emerald-500">$0</p>
      </div>
      <div class="bg-white p-3 rounded shadow">
        <p class="text-xs text-gray-500">Gastos</p>
        <p id="totalGastos" class="text-lg font-bold text-red-500">$0</p>
      </div>
      <div class="bg-white p-3 rounded shadow">
        <p class="text-xs text-gray-500">Balance</p>
        <p id="balance" class="text-lg font-bold">$0</p>
      </div>
    </section>

    <form id="formTransaccion" class="bg-white p-4 rounded shadow space-y-3">
      <select id="tipo" required class="w-full p-2 border rounded">
        <option value="ingreso">Ingreso</option>
        <option value="gasto" selected>Gasto</option>
      </select>
      <input type="text" id="descripcion" placeholder="¿En qué gastaste?" required class="w-full p-2 border rounded">
      <input type="number" id="monto" placeholder="Monto" step="0.01" required class="w-full p-2 border rounded">
      <button type="submit" class="w-full bg-emerald-500 text-white py-2 rounded font-semibold hover:bg-emerald-600">
        Agregar
      </button>
    </form>

    <section class="bg-white p-4 rounded shadow">
      <h2 class="font-semibold mb-3">Movimientos</h2>
      <div id="listaTransacciones" class="space-y-2">
        <p class="text-gray-400 text-center">No hay movimientos aún</p>
      </div>
    </section>
  </main>

  <script>
    const CLAVE = 'finanzas_v1';

    function obtenerTransacciones() {
      const datos = localStorage.getItem(CLAVE);
      return datos ? JSON.parse(datos) : [];
    }

    function guardar(transacciones) {
      localStorage.setItem(CLAVE, JSON.stringify(transacciones));
    }

    function agregarTransaccion(tipo, descripcion, monto) {
      const transacciones = obtenerTransacciones();
      transacciones.push({
        id: Date.now(),
        tipo: tipo,
        descripcion: descripcion,
        monto: parseFloat(monto),
        fecha: new Date().toISOString()
      });
      guardar(transacciones);
    }

    function actualizarVista() {
      const transacciones = obtenerTransacciones();

      let ingresos = 0;
      let gastos = 0;
      transacciones.forEach(function(t) {
        if (t.tipo === 'ingreso') {
          ingresos += t.monto;
        } else {
          gastos += t.monto;
        }
      });

      document.getElementById('totalIngresos').textContent = '$' + ingresos.toFixed(2);
      document.getElementById('totalGastos').textContent = '$' + gastos.toFixed(2);
      document.getElementById('balance').textContent = '$' + (ingresos - gastos).toFixed(2);

      var lista = document.getElementById('listaTransacciones');
      if (transacciones.length === 0) {
        lista.innerHTML = '<p class="text-gray-400 text-center">No hay movimientos aún</p>';
        return;
      }

      var html = '';
      transacciones.sort(function(a, b) { return b.id - a.id; });
      transacciones.forEach(function(t) {
        var signo = t.tipo === 'ingreso' ? '+' : '-';
        var color = t.tipo === 'ingreso' ? 'text-emerald-500' : 'text-red-500';
        var fecha = new Date(t.fecha).toLocaleDateString();
        html += '<div class="flex justify-between items-center border-b pb-2">' +
                  '<div>' +
                    '<span class="font-medium">' + t.descripcion + '</span>' +
                    '<span class="text-xs text-gray-400 ml-2">' + fecha + '</span>' +
                  '</div>' +
                  '<span class="font-bold ' + color + '">' + signo + '$' + t.monto.toFixed(2) + '</span>' +
                '</div>';
      });
      lista.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() {
      var form = document.getElementById('formTransaccion');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var tipo = document.getElementById('tipo').value;
        var descripcion = document.getElementById('descripcion').value.trim();
        var monto = document.getElementById('monto').value;
        if (!descripcion || !monto) return;
        agregarTransaccion(tipo, descripcion, monto);
        form.reset();
        actualizarVista();
      });
      actualizarVista();
    });
  </script>

</body>
</html>
