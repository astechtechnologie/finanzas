<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="manifest" href="manifest.json">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --color-fondo: #f3f4f6;
      --color-tarjeta: #ffffff;
      --color-texto: #1f2937;
      --color-texto-secundario: #6b7280;
      --color-boton: #10b981;
      --color-boton-hover: #059669;
      --color-ingreso: #10b981;
      --color-gasto: #ef4444;
      --sombra: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] {
      --color-fondo: #0f172a;
      --color-tarjeta: #1e293b;
      --color-texto: #f1f5f9;
      --color-texto-secundario: #94a3b8;
      --sombra: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.4);
    }
    * { transition: background-color 0.3s, color 0.3s, box-shadow 0.3s; }
    body {
      background-color: var(--color-fondo);
      color: var(--color-texto);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
    }
    .tarjeta {
      background-color: var(--color-tarjeta);
      box-shadow: var(--sombra);
      border-radius: 1rem;
    }
    .texto-secundario { color: var(--color-texto-secundario); }
    .btn-ingreso { background-color: var(--color-ingreso); color: white; }
    .btn-gasto { background-color: var(--color-gasto); color: white; }
    canvas { max-height: 250px; }
    .relative { position: relative; }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</head>
<body class="flex items-center justify-center">
  <div class="w-full max-w-lg mx-auto space-y-6">

    <!-- PANTALLA DE AUTENTICACIÓN -->
    <div id="authScreen" class="hidden space-y-6">
      <div class="text-center">
        <h1 class="text-4xl font-extrabold text-emerald-500">💰 Mis Finanzas</h1>
        <p class="texto-secundario mt-2">Controla tus ingresos y gastos</p>
      </div>
      <div class="tarjeta p-6 space-y-4">
        <h2 class="text-xl font-bold">Iniciar sesión o registrarse</h2>
        <input type="email" id="email" placeholder="Correo electrónico" class="w-full p-3 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]">
        <div class="relative">
          <input type="password" id="password" placeholder="Contraseña" minlength="6" class="w-full p-3 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)] pr-10">
          <span id="togglePassword" class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <button id="btnLogin" class="btn-ingreso py-3 rounded-xl font-semibold hover:opacity-90">Iniciar sesión</button>
          <button id="btnRegister" class="bg-emerald-500 text-white py-3 rounded-xl font-semibold hover:opacity-90">Registrarse</button>
        </div>
        <button id="btnResetPassword" class="w-full text-sm text-blue-500 hover:underline">¿Olvidaste tu contraseña?</button>
        <p id="authError" class="text-red-400 text-sm hidden"></p>
        <p id="authSuccess" class="text-emerald-500 text-sm hidden"></p>
      </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="appScreen" class="hidden space-y-6">
      <!-- Cabecera -->
      <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-emerald-500">💰 Finanzas</h1>
        <div class="flex gap-2">
          <button id="btnCategorias" class="text-2xl p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">🏷️</button>
          <button id="btnCambiarPassword" class="text-2xl p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700" title="Cambiar contraseña">🔐</button>
          <button id="toggleTema" class="text-2xl p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">🌙</button>
          <button id="btnLogout" class="text-2xl p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700" title="Cerrar sesión">🚪</button>
        </div>
      </div>

      <!-- Panel de cambio de contraseña (oculto) -->
      <div id="panelCambioPassword" class="tarjeta p-4 hidden space-y-3">
        <h2 class="font-bold text-lg">🔐 Cambiar contraseña</h2>
        <input type="password" id="currentPassword" placeholder="Contraseña actual" class="w-full p-3 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]">
        <input type="password" id="newPassword" placeholder="Nueva contraseña (mín. 6 caracteres)" minlength="6" class="w-full p-3 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]">
        <button id="btnUpdatePassword" class="w-full bg-emerald-500 text-white py-3 rounded-xl font-semibold hover:opacity-90">Actualizar contraseña</button>
        <p id="passwordError" class="text-red-400 text-sm hidden"></p>
        <p id="passwordSuccess" class="text-emerald-500 text-sm hidden"></p>
      </div>

      <!-- Panel de categorías (oculto) -->
      <div id="panelCategorias" class="tarjeta p-4 hidden space-y-3">
        <h2 class="font-bold text-lg">🏷️ Mis categorías</h2>
        <div id="listaCategorias" class="space-y-2 max-h-48 overflow-y-auto"></div>
        <form id="formCategoria" class="space-y-2">
          <div class="flex gap-2 items-end">
            <input type="text" id="nombreCategoria" placeholder="Nombre" required class="flex-1 p-2 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]">
            <input type="text" id="emojiCategoria" placeholder="🍕" maxlength="2" class="w-16 p-2 border rounded-xl bg-[var(--color-tarjeta)] text-center" readonly>
            <input type="color" id="colorCategoria" value="#10b981" class="w-10 h-10 p-1 border rounded-xl">
            <button type="submit" class="bg-emerald-500 text-white px-4 py-2 rounded-xl font-bold hover:opacity-90">+</button>
          </div>
          <div class="grid grid-cols-8 gap-1">
            <span onclick="document.getElementById('emojiCategoria').value='🍔'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🍔</span>
            <span onclick="document.getElementById('emojiCategoria').value='🚌'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🚌</span>
            <span onclick="document.getElementById('emojiCategoria').value='🎮'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🎮</span>
            <span onclick="document.getElementById('emojiCategoria').value='💡'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">💡</span>
            <span onclick="document.getElementById('emojiCategoria').value='📦'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">📦</span>
            <span onclick="document.getElementById('emojiCategoria').value='🏠'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🏠</span>
            <span onclick="document.getElementById('emojiCategoria').value='❤️'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">❤️</span>
            <span onclick="document.getElementById('emojiCategoria').value='🎁'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🎁</span>
            <span onclick="document.getElementById('emojiCategoria').value='📚'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">📚</span>
            <span onclick="document.getElementById('emojiCategoria').value='🐶'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🐶</span>
            <span onclick="document.getElementById('emojiCategoria').value='✈️'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">✈️</span>
            <span onclick="document.getElementById('emojiCategoria').value='🎵'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🎵</span>
            <span onclick="document.getElementById('emojiCategoria').value='🏋️'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🏋️</span>
            <span onclick="document.getElementById('emojiCategoria').value='💊'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">💊</span>
            <span onclick="document.getElementById('emojiCategoria').value='🎬'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🎬</span>
            <span onclick="document.getElementById('emojiCategoria').value='📱'" class="cursor-pointer text-center p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">📱</span>
          </div>
        </form>
      </div>

      <!-- Filtro por mes -->
      <div class="tarjeta p-3 flex items-center gap-2">
        <label for="filtroMes" class="text-sm font-medium texto-secundario">📅</label>
        <input type="month" id="filtroMes" class="flex-1 p-2 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]">
      </div>

      <!-- RESUMEN MEJORADO -->
      <div class="grid grid-cols-2 gap-3">
        <div class="tarjeta p-4 bg-gradient-to-br from-emerald-400 to-emerald-600 text-white">
          <p class="text-sm opacity-90">Ingresos</p>
          <p id="totalIngresos" class="text-2xl font-extrabold">$0</p>
        </div>
        <div class="tarjeta p-4 bg-gradient-to-br from-red-400 to-red-600 text-white">
          <p class="text-sm opacity-90">Gastos</p>
          <p id="totalGastos" class="text-2xl font-extrabold">$0</p>
        </div>
      </div>
      <div class="tarjeta p-4 text-center">
        <p class="text-sm texto-secundario">Balance del mes</p>
        <p id="balance" class="text-3xl font-extrabold"></p>
      </div>

      <!-- GRÁFICAS (Ingresos y Gastos) -->
      <div class="grid grid-cols-2 gap-3">
        <div class="tarjeta p-3">
          <h3 class="text-sm font-semibold text-emerald-500 mb-2 text-center">📈 Ingresos</h3>
          <canvas id="graficaIngresos" class="max-h-40"></canvas>
        </div>
        <div class="tarjeta p-3">
          <h3 class="text-sm font-semibold text-red-500 mb-2 text-center">📉 Gastos</h3>
          <canvas id="graficaGastos" class="max-h-40"></canvas>
        </div>
      </div>

      <!-- FORMULARIO CON PESTAÑAS -->
      <div class="tarjeta p-4 space-y-4">
        <div class="flex gap-0">
          <button id="tabIngreso" class="flex-1 py-2 rounded-l-xl font-semibold bg-emerald-500 text-white">Ingreso</button>
          <button id="tabGasto" class="flex-1 py-2 rounded-r-xl font-semibold bg-gray-300 text-gray-600 dark:bg-gray-700 dark:text-gray-300">Gasto</button>
        </div>
        <form id="formTransaccion" class="space-y-3">
          <input type="date" id="fecha" required class="w-full p-3 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]">
          <select id="categoria" required class="w-full p-3 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]"></select>
          <input type="text" id="descripcion" placeholder="Descripción" required class="w-full p-3 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]">
          <input type="number" id="monto" placeholder="Monto" step="0.01" required class="w-full p-3 border rounded-xl bg-[var(--color-tarjeta)] text-[var(--color-texto)]">
          <button type="submit" id="btnAgregar" class="w-full py-3 rounded-xl font-bold text-white bg-emerald-500 hover:opacity-90">Agregar ingreso</button>
        </form>
      </div>

      <!-- LISTA DE MOVIMIENTOS -->
      <div class="tarjeta p-4">
        <h2 class="font-bold text-lg mb-3">📋 Movimientos</h2>
        <div id="listaTransacciones" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURACIÓN DE FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyAD94mJ0gFuFGvRwhhrn8qTFe3orsO_sDA",
      authDomain: "finanzas-personales-a1ee9.firebaseapp.com",
      projectId: "finanzas-personales-a1ee9",
      storageBucket: "finanzas-personales-a1ee9.firebasestorage.app",
      messagingSenderId: "253217416131",
      appId: "1:253217416131:web:ce754c98c1e062f9c45376",
      measurementId: "G-K645PYV7JP"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let usuarioActual = null;
    let mesSeleccionado = obtenerMesActual();
    let graficaIngresosChart = null;
    let graficaGastosChart = null;
    let categoriasState = [];
    const CLAVE_TEMA = 'tema_oscuro';
    let tipoSeleccionado = 'ingreso';

    // --- MOSTRAR/OCULTAR CONTRASEÑA ---
    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const toggleIcon = document.getElementById('togglePassword');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleIcon.textContent = '🙈';
      } else {
        passInput.type = 'password';
        toggleIcon.textContent = '👁️';
      }
    }

    // --- AUTENTICACIÓN ---
    function mostrarAuth() {
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('appScreen').classList.add('hidden');
    }
    function mostrarApp() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
    }

    document.getElementById('btnLogin').addEventListener('click', function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return;
      auth.signInWithEmailAndPassword(email, password).catch(function(e) {
        document.getElementById('authError').textContent = e.message;
        document.getElementById('authError').classList.remove('hidden');
        document.getElementById('authSuccess').classList.add('hidden');
      });
    });

    document.getElementById('btnRegister').addEventListener('click', function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return;
      auth.createUserWithEmailAndPassword(email, password).catch(function(e) {
        document.getElementById('authError').textContent = e.message;
        document.getElementById('authError').classList.remove('hidden');
        document.getElementById('authSuccess').classList.add('hidden');
      });
    });

    // Restablecer contraseña (envía correo)
    document.getElementById('btnResetPassword').addEventListener('click', function() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        document.getElementById('authError').textContent = 'Ingresa tu correo electrónico.';
        document.getElementById('authError').classList.remove('hidden');
        return;
      }
      auth.sendPasswordResetEmail(email).then(function() {
        document.getElementById('authSuccess').textContent = 'Correo de restablecimiento enviado. Revisa tu bandeja de entrada.';
        document.getElementById('authSuccess').classList.remove('hidden');
        document.getElementById('authError').classList.add('hidden');
      }).catch(function(e) {
        document.getElementById('authError').textContent = e.message;
        document.getElementById('authError').classList.remove('hidden');
        document.getElementById('authSuccess').classList.add('hidden');
      });
    });

    document.getElementById('btnLogout').addEventListener('click', function() { auth.signOut(); });

    auth.onAuthStateChanged(function(user) {
      if (user) { usuarioActual = user; mostrarApp(); cargarDatosIniciales(); }
      else { usuarioActual = null; mostrarAuth(); }
    });

    // --- CAMBIO DE CONTRASEÑA ---
    document.getElementById('btnCambiarPassword').addEventListener('click', function() {
      document.getElementById('panelCambioPassword').classList.toggle('hidden');
      document.getElementById('passwordError').classList.add('hidden');
      document.getElementById('passwordSuccess').classList.add('hidden');
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
    });

    document.getElementById('btnUpdatePassword').addEventListener('click', function() {
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      if (!currentPassword || !newPassword) {
        document.getElementById('passwordError').textContent = 'Ambos campos son obligatorios.';
        document.getElementById('passwordError').classList.remove('hidden');
        return;
      }
      if (newPassword.length < 6) {
        document.getElementById('passwordError').textContent = 'La nueva contraseña debe tener al menos 6 caracteres.';
        document.getElementById('passwordError').classList.remove('hidden');
        return;
      }

      // Reautenticar al usuario con su contraseña actual
      const credential = firebase.auth.EmailAuthProvider.credential(usuarioActual.email, currentPassword);
      usuarioActual.reauthenticateWithCredential(credential).then(function() {
        // Cambiar a la nueva contraseña
        return usuarioActual.updatePassword(newPassword);
      }).then(function() {
        document.getElementById('passwordSuccess').textContent = 'Contraseña actualizada correctamente.';
        document.getElementById('passwordSuccess').classList.remove('hidden');
        document.getElementById('passwordError').classList.add('hidden');
        setTimeout(function() {
          document.getElementById('panelCambioPassword').classList.add('hidden');
          document.getElementById('passwordSuccess').classList.add('hidden');
        }, 2000);
      }).catch(function(e) {
        document.getElementById('passwordError').textContent = e.message;
        document.getElementById('passwordError').classList.remove('hidden');
        document.getElementById('passwordSuccess').classList.add('hidden');
      });
    });

    // --- BASE DE DATOS ---
    function coleccionRef() { return 'usuarios/' + usuarioActual.uid + '/transacciones'; }
    function coleccionCategoriasRef() { return 'usuarios/' + usuarioActual.uid + '/categorias'; }
    function obtenerTransacciones(callback) {
      db.collection(coleccionRef()).orderBy('fecha', 'desc').onSnapshot(function(snap) {
        const transacciones = [];
        snap.forEach(function(doc) { transacciones.push(Object.assign({ id: doc.id }, doc.data())); });
        callback(transacciones);
      });
    }
    function agregarTransaccion(tipo, categoria, descripcion, monto, fecha) {
      db.collection(coleccionRef()).add({ tipo: tipo, categoria: categoria, descripcion: descripcion, monto: parseFloat(monto), fecha: fecha });
    }
    function eliminarTransaccion(id) { db.collection(coleccionRef()).doc(id).delete(); }
    function obtenerCategorias(callback) {
      db.collection(coleccionCategoriasRef()).onSnapshot(function(snap) {
        const categorias = [];
        snap.forEach(function(doc) { categorias.push(Object.assign({ id: doc.id }, doc.data())); });
        if (categorias.length === 0) {
          const predefinidas = [
            { nombre: 'comida', emoji: '🍔', color: '#FF6384' },
            { nombre: 'transporte', emoji: '🚌', color: '#36A2EB' },
            { nombre: 'ocio', emoji: '🎮', color: '#FFCE56' },
            { nombre: 'servicios', emoji: '💡', color: '#4BC0C0' },
            { nombre: 'otros', emoji: '📦', color: '#9966FF' }
          ];
          const batch = db.batch();
          predefinidas.forEach(function(cat) { batch.set(db.collection(coleccionCategoriasRef()).doc(), cat); });
          batch.commit();
          return;
        }
        callback(categorias);
      });
    }
    function agregarCategoria(nombre, emoji, color) {
      db.collection(coleccionCategoriasRef()).add({ nombre: nombre.trim().toLowerCase(), emoji: emoji || '📌', color: color });
    }
    function eliminarCategoria(id) { db.collection(coleccionCategoriasRef()).doc(id).delete(); }

    // --- FILTRO POR MES ---
    function obtenerMesActual() {
      const ahora = new Date();
      return ahora.getFullYear() + '-' + String(ahora.getMonth() + 1).padStart(2, '0');
    }

    // --- GRÁFICAS (DUAL) ---
    function actualizarGraficas(transaccionesFiltradas) {
      const ingresosData = transaccionesFiltradas.filter(function(t) { return t.tipo === 'ingreso'; });
      const gastosData = transaccionesFiltradas.filter(function(t) { return t.tipo === 'gasto'; });

      function agrupar(datos) {
        const agg = {};
        datos.forEach(function(t) {
          if (!agg[t.categoria]) agg[t.categoria] = 0;
          agg[t.categoria] += t.monto;
        });
        return agg;
      }

      function dibujar(ctxId, datos, chartVar, colorDefault) {
        const agg = agrupar(datos);
        const nombres = Object.keys(agg);
        const montos = Object.values(agg);
        const fondos = nombres.map(function(nombre) {
          const cat = categoriasState.find(function(c) { return c.nombre === nombre; });
          return cat ? cat.color : colorDefault;
        });
        if (chartVar) chartVar.destroy();
        const ctx = document.getElementById(ctxId).getContext('2d');
        if (nombres.length === 0) return null;
        return new Chart(ctx, {
          type: 'doughnut',
          data: { labels: nombres, datasets: [{ data: montos, backgroundColor: fondos }] },
          options: { responsive: true, plugins: { legend: { display: false } } }
        });
      }

      graficaIngresosChart = dibujar('graficaIngresos', ingresosData, graficaIngresosChart, '#10b981');
      graficaGastosChart = dibujar('graficaGastos', gastosData, graficaGastosChart, '#ef4444');
    }

    // --- UI (CONCATENACIÓN) ---
    function llenarSelectCategorias() {
      const select = document.getElementById('categoria');
      var opciones = '';
      categoriasState.forEach(function(c) {
        opciones += '<option value="' + c.nombre + '">' + c.emoji + ' ' + c.nombre + '</option>';
      });
      select.innerHTML = opciones;
    }

    function renderizarListaCategorias() {
      const contenedor = document.getElementById('listaCategorias');
      if (categoriasState.length === 0) {
        contenedor.innerHTML = '<p class="texto-secundario text-sm">No hay categorías</p>';
        return;
      }
      var html = '';
      categoriasState.forEach(function(c) {
        html += '<div class="flex items-center justify-between bg-gray-50 dark:bg-gray-800 p-2 rounded-xl">' +
          '<span>' + c.emoji + ' ' + c.nombre + '</span>' +
          '<button onclick="if(confirm(\'¿Eliminar categoría ' + c.nombre + '?\')) eliminarCategoria(\'' + c.id + '\')" class="text-red-400 hover:text-red-600">✕</button>' +
          '</div>';
      });
      contenedor.innerHTML = html;
    }

    function actualizarVista(transacciones) {
      const filtradas = transacciones.filter(function(t) { return t.fecha && t.fecha.startsWith(mesSeleccionado); });
      let ingresos = 0, gastos = 0;
      filtradas.forEach(function(t) { t.tipo === 'ingreso' ? ingresos += t.monto : gastos += t.monto; });
      document.getElementById('totalIngresos').textContent = '$' + ingresos.toFixed(2);
      document.getElementById('totalGastos').textContent = '$' + gastos.toFixed(2);
      const balance = ingresos - gastos;
      const balanceEl = document.getElementById('balance');
      balanceEl.textContent = '$' + balance.toFixed(2);
      balanceEl.className = 'text-3xl font-extrabold ' + (balance >= 0 ? 'text-emerald-500' : 'text-red-500');

      const lista = document.getElementById('listaTransacciones');
      if (filtradas.length === 0) {
        lista.innerHTML = '<p class="texto-secundario text-center">No hay movimientos este mes</p>';
      } else {
        filtradas.sort(function(a, b) { return (b.fecha + b.id).localeCompare(a.fecha + a.id); });
        var html = '';
        filtradas.forEach(function(t) {
          const cat = categoriasState.find(function(c) { return c.nombre === t.categoria; });
          const emoji = cat ? cat.emoji : '📌';
          const color = t.tipo === 'ingreso' ? 'text-emerald-500' : 'text-red-500';
          const signo = t.tipo === 'ingreso' ? '+' : '-';
          const fecha = new Date(t.fecha + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
          html += '<div class="flex items-center gap-3 bg-gray-50 dark:bg-gray-800 p-3 rounded-xl">' +
            '<div class="text-2xl">' + emoji + '</div>' +
            '<div class="flex-1">' +
              '<p class="font-medium">' + t.descripcion + '</p>' +
              '<p class="text-xs texto-secundario">' + fecha + ' · ' + t.categoria + '</p>' +
            '</div>' +
            '<div class="text-right">' +
              '<p class="font-bold ' + color + '">' + signo + '$' + t.monto.toFixed(2) + '</p>' +
              '<button onclick="eliminarTransaccion(\'' + t.id + '\')" class="text-xs text-red-400 hover:text-red-600">Eliminar</button>' +
            '</div>' +
          '</div>';
        });
        lista.innerHTML = html;
      }
      actualizarGraficas(filtradas);
    }

    function cargarDatosIniciales() {
      obtenerCategorias(function(cats) {
        categoriasState = cats;
        llenarSelectCategorias();
        renderizarListaCategorias();
        obtenerTransacciones(function(transacciones) { actualizarVista(transacciones); });
      });
    }

    // --- MODO OSCURO ---
    function aplicarTema(oscuro) {
      document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
      document.getElementById('toggleTema').textContent = oscuro ? '☀️' : '🌙';
    }
    function toggleTema() {
      const actual = document.documentElement.getAttribute('data-theme') === 'dark';
      const nuevo = !actual;
      localStorage.setItem(CLAVE_TEMA, nuevo ? 'dark' : 'light');
      aplicarTema(nuevo);
    }

    // --- INICIO ---
    document.addEventListener('DOMContentLoaded', function() {
      aplicarTema((localStorage.getItem(CLAVE_TEMA) || 'light') === 'dark');
      document.getElementById('toggleTema').addEventListener('click', toggleTema);

      const btnCat = document.getElementById('btnCategorias');
      const panelCat = document.getElementById('panelCategorias');
      btnCat.addEventListener('click', function() {
        panelCat.classList.toggle('hidden');
        if (!panelCat.classList.contains('hidden')) renderizarListaCategorias();
      });

      document.getElementById('formCategoria').addEventListener('submit', function(e) {
        e.preventDefault();
        const nombre = document.getElementById('nombreCategoria').value.trim();
        const emoji = document.getElementById('emojiCategoria').value.trim() || '📌';
        const color = document.getElementById('colorCategoria').value;
        if (!nombre) return;
        agregarCategoria(nombre, emoji, color);
        this.reset();
        document.getElementById('colorCategoria').value = '#10b981';
        document.getElementById('emojiCategoria').value = '';
      });

      // Pestañas
      const tabIngreso = document.getElementById('tabIngreso');
      const tabGasto = document.getElementById('tabGasto');
      const btnAgregar = document.getElementById('btnAgregar');
      tabIngreso.addEventListener('click', function() {
        tipoSeleccionado = 'ingreso';
        tabIngreso.className = 'flex-1 py-2 rounded-l-xl font-semibold bg-emerald-500 text-white';
        tabGasto.className = 'flex-1 py-2 rounded-r-xl font-semibold bg-gray-300 text-gray-600 dark:bg-gray-700 dark:text-gray-300';
        btnAgregar.textContent = 'Agregar ingreso';
        btnAgregar.className = 'w-full py-3 rounded-xl font-bold text-white bg-emerald-500 hover:opacity-90';
      });
      tabGasto.addEventListener('click', function() {
        tipoSeleccionado = 'gasto';
        tabGasto.className = 'flex-1 py-2 rounded-r-xl font-semibold bg-red-500 text-white';
        tabIngreso.className = 'flex-1 py-2 rounded-l-xl font-semibold bg-gray-300 text-gray-600 dark:bg-gray-700 dark:text-gray-300';
        btnAgregar.textContent = 'Agregar gasto';
        btnAgregar.className = 'w-full py-3 rounded-xl font-bold text-white bg-red-500 hover:opacity-90';
      });

      const inputMes = document.getElementById('filtroMes');
      inputMes.value = mesSeleccionado;
      inputMes.addEventListener('change', function() {
        mesSeleccionado = inputMes.value;
        if (usuarioActual) obtenerTransacciones(function(t) { actualizarVista(t); });
      });

      const fechaInput = document.getElementById('fecha');
      fechaInput.value = new Date().toISOString().split('T')[0];

      document.getElementById('formTransaccion').addEventListener('submit', function(e) {
        e.preventDefault();
        const categoria = document.getElementById('categoria').value;
        const descripcion = document.getElementById('descripcion').value.trim();
        const monto = document.getElementById('monto').value;
        const fecha = document.getElementById('fecha').value;
        if (!descripcion || !monto || !categoria || !fecha) return;
        agregarTransaccion(tipoSeleccionado, categoria, descripcion, monto, fecha);
        this.reset();
        fechaInput.value = new Date().toISOString().split('T')[0];
        if (tipoSeleccionado === 'ingreso') tabIngreso.click(); else tabGasto.click();
      });
    });
  </script>
</body>
</html>
