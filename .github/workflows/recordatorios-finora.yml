name: Finora - recordatorios gratuitos

on:
  schedule:
    # Cada 15 minutos; el script decide la hora de cada usuario.
    # La zona es informativa para el cron; el script lee la zona guardada de cada usuario.
    - cron: '7,22,37,52 * * * *'
      timezone: 'America/Bogota'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finora-recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencia de Firebase
        run: npm install --prefix scripts/recordatorios --no-audit --no-fund

      - name: Comprobar cálculo de horarios
        run: npm test --prefix scripts/recordatorios

      - name: Enviar recordatorios que corresponden
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/recordatorios/enviar.js
